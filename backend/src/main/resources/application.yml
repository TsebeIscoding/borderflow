# Per-site config. In deployment, SITE_ID and the datasource URL are
# injected per Kubernetes namespace (see ../../infra/k8s/<site>/*.yaml) --
# this file holds only the defaults shared across all four sites.

spring:
  application:
    name: borderflow-site-service
  datasource:
    url: jdbc:postgresql://localhost:5432/borderflow
    username: app_user
    password: ${DB_APP_USER_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway (../../db/migrations), never by JPA
  flyway:
    enabled: false          # migrations are applied via the site-specific kubectl/flyway
                             # flow in infra/k8s, not by this service on boot -- see
                             # db/migrations/README.md

site:
  id: ${SITE_ID:unset}      # depot | border | port | destination

# RSA keypairs are LOCAL DEV ONLY -- checked into
# src/main/resources/keys/ purely so this project runs out of the box.
# A real deployment loads these from a secrets manager or a mounted
# volume, never ships them inside the JAR. See backend/README.md.
#
# depotPublicKeyPath is deliberately NOT derived from SITE_ID -- every
# site trusts the SAME Depot public key to verify cross-site AUDITOR
# tokens, regardless of which site this instance is.
borderflow:
  jwt:
    site-private-key-path: keys/${SITE_ID:depot}-private.pem
    site-public-key-path: keys/${SITE_ID:depot}-public.pem
    depot-public-key-path: keys/depot-public.pem
    expiration-minutes: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info
